name: edumatrix
services:
  edumatrix:
    build: .
    container_name: edumatrix
    ports:
      - "8000:8000"
    volumes:
      - edumatrix_data:/app/data
    restart: unless-stopped
    environment:
      # Secrets are supplied only by the deployment environment or secret manager.
      - EDUMATRIX_LLM_PROVIDER=${EDUMATRIX_LLM_PROVIDER:-deterministic}
      - EDUMATRIX_LLM_API_KEY=${EDUMATRIX_LLM_API_KEY:-}
      - EDUMATRIX_EMBEDDING_PROVIDER=hash
      - EDUMATRIX_USE_FAISS=0
      - EDUMATRIX_LLM_ENDPOINT=${EDUMATRIX_LLM_ENDPOINT:-}
      - EDUMATRIX_LLM_MODEL=${EDUMATRIX_LLM_MODEL:-deterministic}
      - EDUMATRIX_MAX_CONCURRENT_LLM=8
      - EDUMATRIX_LLM_RATE_LIMIT_RPM=120
      - EDUMATRIX_LLM_RATE_LIMIT_TPM=100000
      - EDUMATRIX_CIRCUIT_BREAKER_THRESHOLD=5
      - EDUMATRIX_CIRCUIT_BREAKER_WINDOW=60
      - EDUMATRIX_RETRY_MAX_ATTEMPTS=3

volumes:
  edumatrix_data:
